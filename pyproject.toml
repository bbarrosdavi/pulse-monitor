[project]
name = "pulse-monitor"
version = "0.1.0"
description = "Instrumento Virtual para Monitoramento Cardíaco (PPG/SpO2) com Arduino Pro Micro, MAX30102 (simulado/real) e IHM em PySide6/PyQtGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pyqtgraph>=0.13.7",
    "pyserial>=3.5",
    "PySide6-Essentials>=6.7.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pulse-monitor = "pulse_monitor.app:main"
pulse-monitor-sim = "pulse_monitor.simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
